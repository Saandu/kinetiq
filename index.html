<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover exposes env(safe-area-inset-*) so the layout can pad
         itself around notches and home indicators rather than sitting under them -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111216" media="(prefers-color-scheme: dark)" />
    <title>Kinetiq — Condition Monitoring</title>
    <meta
      name="description"
      content="Kinetiq is a condition-monitoring dashboard for industrial machines: live availability, machine-state analysis and predictive maintenance windows."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Set the theme before first paint without weakening script-src. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
