<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover exposes env(safe-area-inset-*) so the layout can pad
         itself around notches and home indicators rather than sitting under them -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111216" media="(prefers-color-scheme: dark)" />
    <title>Kinetiq — Condition Monitoring</title>
    <meta
      name="description"
      content="A Vue 3 and TypeScript portfolio demo by Alexandru Lungu. Explore industrial machine monitoring with simulated telemetry, alerts and maintenance workflows."
    />
    <meta name="author" content="Alexandru Lungu" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kinetiq — Industrial monitoring portfolio demo" />
    <meta property="og:description" content="A standalone Vue 3 and TypeScript demo by Alexandru Lungu, revisiting a paid 2023 industrial dashboard project with fictional telemetry." />
    <meta property="og:url" content="https://kinetiq-dashboard.web.app/" />
    <meta property="og:image" content="https://kinetiq-dashboard.web.app/social-preview.png" />
    <meta property="og:image:alt" content="Kinetiq dashboard with fictional machine availability and alert severity" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Set the theme before first paint without weakening script-src. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
