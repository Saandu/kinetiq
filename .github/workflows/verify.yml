name: CI / CD

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  # Finish an active production deployment instead of interrupting Firebase.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm audit --omit=dev --audit-level=high
      - name: Save the verified production build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosting-${{ github.sha }}
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 7
      - name: Verify hosting artifact round trip
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hosting-${{ github.sha }}
          path: .tools/hosting-artifact/
      - run: node scripts/verify-ci-artifact.mjs

  pipeline:
    name: Verify MQTT and SQS pipeline
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run db:image
      - run: npm run services:images
      - name: Verify the real local transport and recovery paths
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN_CI }}
        run: npm run test:pipeline
      - name: Start the complete local application
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN_CI }}
        run: |
          node --input-type=module -e "import {writeFileSync} from 'node:fs'; const token=process.env.LOCALSTACK_AUTH_TOKEN; if(!token || /[\r\n]/.test(token)) throw new Error('CI LocalStack token missing or invalid'); writeFileSync('.env.local','LOCALSTACK_AUTH_TOKEN='+token+'\n',{mode:0o600});"
          npm run local:up
          npm run local:verify
      - name: Stop local application
        if: always()
        run: |
          # Compose parses env_file even during down; setup may have failed first.
          touch .env.local
          docker compose down
          rm -f .env.local

  kubernetes-config:
    name: Verify pinned Kubernetes and GitOps configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run k8s:tools
      - run: npm run docker:lint
      - run: npm run helm:verify
      - run: npm run k8s:scaling:config
      - run: npm run k8s:gitops:config

  kubernetes:
    name: Disposable cluster, S3 restore and GitOps pipeline
    needs: [verify, kubernetes-config]
    # Repository pushes require write access. Fork PR runs never receive this
    # secret; do not run their code under pull_request_target/workflow_run.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Name the exact checked-out commit for the local Git mirror
        run: git switch -C "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install pinned tools and build all local images
        run: |
          npm run k8s:tools
          # Host-side broker setup imports the compiled workspace contracts.
          # Building Docker images does not populate the runner's dist folders.
          npm run build --workspace @kinetiq/contracts
          npm run db:image
          npm run services:images
          docker build -t kinetiq-web:local -f infra/docker/web/Dockerfile .
      - name: Supply the emulator token without logging it
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN_CI }}
        run: |
          node --input-type=module -e "import {writeFileSync} from 'node:fs'; const token=process.env.LOCALSTACK_AUTH_TOKEN; if(!token || /[\r\n]/.test(token)) throw new Error('CI LocalStack token missing or invalid'); writeFileSync('.env.local','LOCALSTACK_AUTH_TOKEN='+token+'\n',{mode:0o600});"
      - name: Bootstrap a fresh cluster and verify fresh-volume S3 recovery
        run: |
          npm run k8s:up
          npm run k8s:images
          npm run k8s:operators
          npm run k8s:database
          # No simulator is running yet: source/restore fingerprints are stable.
          npm run k8s:database:verify
          npm run k8s:messaging
      - name: Reconcile the committed branch through Argo CD
        run: npm run k8s:gitops -- ci
      - name: Install bounded queue scaling
        run: npm run k8s:scaling
      - name: Verify hooks, drift repair and fresh dashboard data
        run: npm run k8s:gitops:verify
      - name: Verify MQTT and network boundaries
        run: npm run k8s:boundaries:verify
      - name: Verify backlog scaling and recovery
        run: npm run k8s:scaling:verify
      - name: Record reconciled revision and health
        run: npm run k8s:gitops:status
      - name: Remove disposable cluster and local secret files
        if: always()
        run: |
          if [ -x .tools/k8s/bin-linux/k3d ]; then
            .tools/k8s/bin-linux/k3d cluster delete kinetiq-local
          fi
          # This job runs on an ephemeral runner; never copy these into artifacts.
          rm -f .env.local .tools/k8s/kinetiq.kubeconfig
          rm -rf .tools/k8s/secrets

  deploy:
    name: Deploy Firebase Hosting
    needs: [verify, pipeline, kubernetes-config, kubernetes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hosting-${{ github.sha }}
          path: apps/web/dist/
      - name: Install the pinned Firebase CLI
        run: npm install --global firebase-tools@15.32.1
      - name: Check that this is still the latest main commit
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "A newer main commit exists; skipping this superseded deployment." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Authenticate with short-lived Google credentials
        if: steps.latest.outputs.deploy == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: kinetiq-app-k7x2
          workload_identity_provider: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - name: Deploy the verified build
        if: steps.latest.outputs.deploy == 'true'
        run: firebase deploy --project kinetiq-app-k7x2 --only hosting --non-interactive --message "$GITHUB_SHA"
      - name: Verify the deployed version
        if: steps.latest.outputs.deploy == 'true'
        run: node scripts/verify-deployment.mjs
      - name: Record deployment
        if: steps.latest.outputs.deploy == 'true'
        run: |
          echo "Deployed commit $GITHUB_SHA to https://kinetiq-dashboard.web.app" >> "$GITHUB_STEP_SUMMARY"
