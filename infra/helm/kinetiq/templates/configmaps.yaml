{{- range $name := list "api" "ingest" "local-bridge" "simulator" "web" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    {{- include "kinetiq.labels" $ | nindent 4 }}
data:
  {{- if eq $name "api" }}
  API_MODE: local-readonly
  DEMO_ORGANIZATION_ID: {{ $.Values.organizationId | quote }}
  DATABASE_URL_FILE: /secrets/runtime/credential
  {{- else if eq $name "ingest" }}
  DATABASE_URL_FILE: /secrets/runtime/credential
  SQS_ENDPOINT: http://localstack:4566
  SQS_QUEUE_URL: {{ $.Values.queue.url | quote }}
  {{- else if eq $name "local-bridge" }}
  MQTT_URL: mqtt://mosquitto:1883
  MQTT_BRIDGE_PASSWORD_FILE: /secrets/runtime/credential
  SQS_ENDPOINT: http://localstack:4566
  SQS_QUEUE_URL: {{ $.Values.queue.url | quote }}
  {{- else if eq $name "simulator" }}
  MQTT_URL: mqtt://mosquitto:1883
  MQTT_DEVICE_PASSWORD_FILE: /secrets/runtime/credential
  SITE_ID: {{ $.Values.siteId | quote }}
  DEVICE_COUNT: "12"
  PUBLISH_MS: "60000"
  {{- else }}
  TELEMETRY_MODE: local-readonly
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-web-server
  labels:
    {{- include "kinetiq.labels" . | nindent 4 }}
data:
  nginx.conf: |
    worker_processes auto;
    error_log /dev/stderr warn;
    pid /tmp/nginx.pid;
    events { worker_connections 1024; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      access_log /dev/stdout;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      include /tmp/default.conf;
    }
  default.conf: |
{{ .Files.Get "files/default.conf" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-setup
  labels:
    {{- include "kinetiq.labels" . | nindent 4 }}
data:
  migrations.mjs: |
{{ .Files.Get "files/migrations.mjs" | indent 4 }}
  queues.mjs: |
{{ .Files.Get "files/queues.mjs" | indent 4 }}
