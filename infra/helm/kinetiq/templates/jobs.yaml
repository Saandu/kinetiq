{{- if .Values.jobs.enabled }}
{{- range $name := list "migrations" "queues" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    {{- include "kinetiq.labels" $ | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $.Release.Name }}-{{ $name }}-{{ $.Release.Revision }}
  labels:
    {{- include "kinetiq.labels" $ | nindent 4 }}
  {{- if $.Values.gitops.enabled }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
  {{- end }}
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kinetiq
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      serviceAccountName: {{ $.Release.Name }}-{{ $name }}
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: {{ $name }}
          image: {{ $.Values.components.api.image | quote }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          {{- if $.Values.gitops.enabled }}
          # Hooks run before Sync ConfigMaps exist. Carry this revision's script
          # inside the Job; bootstrap provides only stable SAs and network rules.
          command: [node, --input-type=module, -e]
          args:
            - {{ $.Files.Get (printf "files/%s.mjs" $name) | quote }}
          {{- else }}
          command: [node, /app/infra/k8s/{{ $name }}.mjs]
          {{- end }}
          securityContext:
            {{- include "kinetiq.security" $ | nindent 12 }}
          resources:
            {{- toYaml $.Values.jobs.resources | nindent 12 }}
          env:
            {{- if eq $name "migrations" }}
            - {name: DATABASE_URL_FILE, value: /secrets/admin/database-url}
            - {name: DATABASE_CA_FILE, value: /secrets/ca/ca.crt}
            {{- if $.Values.gitops.enabled }}
            - {name: DATABASE_CONNECT_HOST, value: "kinetiq-db-rw.{{ $.Release.Namespace }}.svc.cluster.local"}
            {{- end }}
            {{- else }}
            - {name: SQS_QUEUE_URL, value: {{ $.Values.queue.url | quote }}}
            {{- end }}
          volumeMounts:
            {{- if not $.Values.gitops.enabled }}
            - {name: setup, mountPath: /app/infra/k8s, readOnly: true}
            {{- end }}
            - {name: tmp, mountPath: /tmp}
            {{- if eq $name "migrations" }}
            - {name: database-ca, mountPath: /secrets/ca, readOnly: true}
            {{- range $area := list "admin" "api" "ingest" }}
            - {name: {{ $area }}, mountPath: /secrets/{{ $area }}, readOnly: true}
            {{- end }}
            {{- end }}
      volumes:
        {{- if not $.Values.gitops.enabled }}
        - name: setup
          configMap: {name: {{ $.Release.Name }}-setup}
        {{- end }}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        {{- if eq $name "migrations" }}
        - name: database-ca
          secret:
            secretName: {{ $.Values.database.clusterName }}-ca
            defaultMode: 288
            items: [{key: ca.crt, path: ca.crt}]
        {{- range $area := list "admin" "api" "ingest" }}
        - name: {{ $area }}
          secret: {secretName: {{ index $.Values.secrets $area }}, defaultMode: 288}
        {{- end }}
        {{- end }}
{{- end }}
{{- end }}
