{{- if gt (len .Release.Name) 40 }}{{ fail "Release name must be at most 40 characters" }}{{ end }}
{{- include "kinetiq.validate" . }}
{{- range $name, $component := .Values.components }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    {{- include "kinetiq.labels" $ | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    {{- include "kinetiq.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $component.replicas }}
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 600
  strategy:
    {{- if has $name (list "simulator" "local-bridge") }}
    type: Recreate
    {{- else }}
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
    {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kinetiq
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmaps.yaml") $ | sha256sum }}
    spec:
      serviceAccountName: {{ $.Release.Name }}-{{ $name }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ $component.uid }}
        runAsGroup: {{ $component.uid }}
        fsGroup: {{ $component.uid }}
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: {{ $name }}
          image: {{ $component.image | quote }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          {{- if eq $name "web" }}
          command: [/bin/sh, -ec]
          args:
            - |
              dns=$(awk '/^nameserver / {print $2; exit}' /etc/resolv.conf)
              test -n "$dns"
              sed "s/__DNS__/$dns/g" /config/default.conf > /tmp/default.conf
              exec nginx -c /config/nginx.conf -g 'daemon off;'
          {{- end }}
          ports:
            - {name: http, containerPort: 8080}
          securityContext:
            {{- include "kinetiq.security" $ | nindent 12 }}
          resources:
            {{- toYaml $component.resources | nindent 12 }}
          envFrom:
            - configMapRef: {name: {{ $.Release.Name }}-{{ $name }}}
          startupProbe:
            httpGet: {path: {{ ternary "/healthz" "/health/live" (eq $name "web") }}, port: http}
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: {path: {{ ternary "/healthz" "/health/live" (eq $name "web") }}, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: {{ ternary "/healthz" "/health/ready" (eq $name "web") }}, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- if has $name (list "api" "ingest") }}
            - {name: database-ca, mountPath: /secrets/ca, readOnly: true}
            {{- end }}
            {{- if eq $name "web" }}
            - {name: web-config, mountPath: /config, readOnly: true}
            {{- else }}
            - {name: credentials, mountPath: /secrets/runtime, readOnly: true}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        {{- if has $name (list "api" "ingest") }}
        - name: database-ca
          secret:
            secretName: {{ $.Values.database.clusterName }}-ca
            defaultMode: 288
            items: [{key: ca.crt, path: ca.crt}]
        {{- end }}
        {{- if eq $name "web" }}
        - name: web-config
          configMap: {name: {{ $.Release.Name }}-web-server}
        {{- else }}
        - name: credentials
          secret:
            secretName: {{ index $.Values.secrets (get (dict "api" "api" "ingest" "ingest" "simulator" "mqttDevice" "local-bridge" "mqttBridge") $name) }}
            defaultMode: 288 # octal 0440
            items:
              - key: {{ ternary "database-url" "password" (has $name (list "api" "ingest")) }}
                path: credential
        {{- end }}
{{- end }}
