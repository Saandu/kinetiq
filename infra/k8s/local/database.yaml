apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: kinetiq-db
  namespace: kinetiq-local
spec:
  instances: 1
  imageName: kinetiq-postgres:18.6-1
  imagePullPolicy: Never
  postgresUID: 999
  postgresGID: 999
  enableSuperuserAccess: true
  superuserSecret: {name: kinetiq-db-admin}
  certificates:
    serverAltDNSNames: [postgres, postgres.kinetiq-local, postgres.kinetiq-local.svc, postgres.kinetiq-local.svc.cluster.local]
  bootstrap:
    initdb:
      database: kinetiq
      owner: kinetiq_owner
  storage:
    size: 2Gi
    storageClass: local-path
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: '1', memory: 512Mi}
  postgresql:
    pg_hba: ['hostnossl all all all reject']
    shared_preload_libraries: [pg_cron]
    parameters:
      cron.database_name: kinetiq
      cron.use_background_workers: 'on'
      timezone: UTC
      max_connections: '50'
      shared_buffers: 64MB
      archive_timeout: 60s
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: kinetiq-backups
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: kinetiq-backups
  namespace: kinetiq-local
spec:
  retentionPolicy: 7d
  instanceSidecarConfiguration:
    retentionPolicyIntervalSeconds: 1800
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {cpu: '1', memory: 256Mi}
  configuration:
    destinationPath: s3://kinetiq-backups/
    endpointURL: http://localstack:4566
    s3Credentials:
      accessKeyId: {name: kinetiq-backup-s3, key: access-key}
      secretAccessKey: {name: kinetiq-backup-s3, key: secret-key}
      region: {name: kinetiq-backup-s3, key: region}
    wal:
      compression: gzip
      maxParallel: 2
    data:
      compression: gzip
      jobs: 1
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: kinetiq-db-daily
  namespace: kinetiq-local
spec:
  schedule: '0 0 3 * * *'
  backupOwnerReference: cluster
  cluster: {name: kinetiq-db}
  method: plugin
  pluginConfiguration: {name: barman-cloud.cloudnative-pg.io}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: kinetiq-database-boundary, namespace: kinetiq-local}
spec:
  podSelector:
    matchExpressions: [{key: cnpg.io/cluster, operator: Exists}]
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [api, ingest, migrations, database-check]
      ports: [{protocol: TCP, port: 5432}]
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: cnpg-system}}
      ports: [{protocol: TCP, port: 8000}, {protocol: TCP, port: 9187}]
    - from:
        - podSelector:
            matchExpressions: [{key: cnpg.io/cluster, operator: Exists}]
      ports: [{protocol: TCP, port: 5432}, {protocol: TCP, port: 8000}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/component: localstack}}
      ports: [{protocol: TCP, port: 4566}]
    - to:
        - podSelector:
            matchExpressions: [{key: cnpg.io/cluster, operator: Exists}]
      ports: [{protocol: TCP, port: 5432}, {protocol: TCP, port: 8000}]
    # The instance manager watches Kubernetes through its service and node endpoint.
    - ports: [{protocol: TCP, port: 443}, {protocol: TCP, port: 6443}]
