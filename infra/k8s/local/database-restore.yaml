# A separate Cluster creates a fresh PVC; it cannot reuse the source database volume.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata: {name: kinetiq-db-restore, namespace: kinetiq-local}
spec:
  instances: 1
  imageName: kinetiq-postgres:18.6-1
  imagePullPolicy: Never
  postgresUID: 999
  postgresGID: 999
  enableSuperuserAccess: true
  superuserSecret: {name: kinetiq-db-admin}
  bootstrap:
    recovery: {source: backup-source}
  externalClusters:
    - name: backup-source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: kinetiq-backups
          serverName: kinetiq-db
  storage: {size: 2Gi, storageClass: local-path}
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: '1', memory: 512Mi}
  postgresql:
    pg_hba: ['hostnossl all all all reject']
    shared_preload_libraries: [pg_cron]
    parameters:
      cron.database_name: kinetiq
      cron.use_background_workers: 'on'
      timezone: UTC
      max_connections: '50'
      shared_buffers: 64MB
